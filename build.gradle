plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
}
// The override is for isolated Gradle build-contract checks; Windows launchers use the default.
def productVersion = providers.gradleProperty('realmSharkVersion').getOrElse('v1.2.3')
if (!(productVersion ==~ /v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?/) || productVersion.length() > 80) {
    throw new GradleException('realmSharkVersion must be vMAJOR.MINOR.PATCH with an optional filename-safe suffix (at most 80 characters).')
}
project.version = productVersion
applicationName = 'RealmShark'

if (project.hasProperty('realmSharkBuildDir')) {
    buildDir = file(project.property('realmSharkBuildDir'))
}

if (productVersion != 'v1.2.3') {
    def isolationError = 'A build-contract version override requires an isolated realmSharkBuildDir.'
    if (!project.hasProperty('realmSharkBuildDir')) {
        throw new GradleException(isolationError)
    }
    // Compare canonical path components, including absolute and dot-segment aliases.
    def projectPath = projectDir.canonicalFile.toPath()
    def sourcePath = file('src').canonicalFile.toPath()
    def defaultBuildPath = file('build').canonicalFile.toPath()
    def outputPath = buildDir.canonicalFile.toPath()
    def nestedBuild = outputPath.startsWith(defaultBuildPath) && outputPath != defaultBuildPath
    def externalBuild = !outputPath.startsWith(projectPath)
    if (outputPath.parent == null || projectPath.startsWith(outputPath) || defaultBuildPath.startsWith(outputPath)
            || sourcePath.startsWith(outputPath) || outputPath.startsWith(sourcePath)
            || (!nestedBuild && !externalBuild)) {
        throw new GradleException("${isolationError} Use a dedicated subdirectory of ${defaultBuildPath} or an external directory, excluding project/source/default-build ancestors. Rejected: ${outputPath}")
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven {url="https://s01.oss.sonatype.org/content/repositories/snapshots/"}
}

dependencies {
    implementation 'com.ardikars.pcap:pcap-spi:1.4.2'
    implementation 'com.ardikars.pcap:pcap-jdk7:1.4.2'
    implementation 'com.google.code.gson:gson:2.9.1'
    implementation 'net.java.dev.jna:jna:5.12.1'
    implementation 'com.google.flatbuffers:flatbuffers-java:23.5.26'
    implementation 'com.github.weisj:darklaf-core:3.0.2'
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
    testImplementation 'junit:junit:4.13.2'
}

mainClassName = 'realmshark.RealmShark'

def brandingResources = layout.buildDirectory.dir('generated/branding')
def brandingGeneratorClasses = layout.buildDirectory.dir('classes/brandingGenerator')

// Isolated from application compilation: processResources must not depend on compileJava.
tasks.register('compileBrandingGenerator', JavaCompile) {
    source = files('src/main/java/realmshark/branding/FinIcon.java', 'scripts/packaging/GenerateBranding.java')
    classpath = files()
    destinationDirectory = brandingGeneratorClasses
    options.release = 17
}

tasks.register('generateBranding', JavaExec) {
    dependsOn tasks.named('compileBrandingGenerator')
    classpath = files(brandingGeneratorClasses)
    mainClass = 'GenerateBranding'
    jvmArgs '-Djava.awt.headless=true'
    args brandingResources.get().asFile.absolutePath
    inputs.files(tasks.named('compileBrandingGenerator'))
    outputs.dir(brandingResources)
}

sourceSets.main.resources.srcDir(brandingResources)
processResources {
    dependsOn tasks.named('generateBranding')
    exclude 'icon/tomatoIcon.png'
    from('docs/UNITYPY-LICENSE.txt') {
        into 'META-INF/licenses'
    }
}


jar {
    manifest {
        attributes(
                'Main-Class': mainClassName
        )
    }
}

def generatedVersion = layout.buildDirectory.dir('generated/sources/version/main')
def generatedVersionTask = tasks.register('generateSources') {
    inputs.property('productVersion', productVersion)
    outputs.dir(generatedVersion)
    doLast {
        def source = new File(generatedVersion.get().asFile, 'realmshark/version/Version.java')
        source.parentFile.mkdirs()
        source.setText(
                "package realmshark.version;\n" +
                "public class Version {\n" +
                "    public static final String VERSION = \"${productVersion}\";\n" +
                "}\n", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(generatedVersionTask)

/**
 * add to vm optoins
 * "-XstartOnFirstThread"
 */
shadowJar {
    manifest {
        attributes 'Main-Class': mainClassName
    }
    archiveFileName = "${applicationName}-${project.version}.jar"
}

// Gradle 7.6.4 toolchains select the tools; release separately limits main APIs/bytecode.
def compiler17 = javaToolchains.compilerFor(java.toolchain)
def launcher17 = javaToolchains.launcherFor(java.toolchain)
tasks.withType(JavaCompile).configureEach {
    javaCompiler = compiler17
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach {
    javaLauncher = launcher17
    doFirst { systemProperty 'realmshark.historyDir', new File(workingDir, 'shared-history').absolutePath }
}
tasks.withType(JavaExec).configureEach {
    javaLauncher = launcher17
}
tasks.named('compileJava', JavaCompile) {
    options.release = 8
}
tasks.named('compileTestJava', JavaCompile) {
    options.release = 17
}

test {
    // Keep GUI-test preferences and session files away from real user settings.
    workingDir = file("$buildDir/ui-test")
    doFirst { workingDir.mkdirs() }
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
}
