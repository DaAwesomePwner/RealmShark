// Keep visual validation and packaging separate from other local builds.
allprojects {
    buildDir = file("build/typography-validation")
    afterEvaluate {
        [Ui150: '1.5', Ui200: '2'].each { suffix, scale ->
            tasks.register("test${suffix}", Test) {
                description = "Validate populated Swing layouts at ${scale}x display scaling."
                group = 'verification'
                testClassesDirs = sourceSets.test.output.classesDirs
                classpath = sourceSets.test.runtimeClasspath
                workingDir = file("$buildDir/ui-${suffix}")
                doFirst { workingDir.mkdirs() }
                jvmArgs "-Dsun.java2d.uiScale=${scale}"
                filter {
                    includeTestsMatching 'ui.WorkspaceUiTest'
                    includeTestsMatching 'ui.ContentStyleTest'
                    includeTestsMatching 'ui.WorkspaceShellNavigationTest'
                    includeTestsMatching 'tomato.gui.security.ParsePanelRefreshTest'
                    includeTestsMatching 'tomato.gui.security.InspectSessionHistoryTest'
                    includeTestsMatching 'tomato.gui.history.SessionPanelTest'
                    includeTestsMatching 'tomato.gui.chat.ChatHistoryTest'
                    includeTestsMatching 'tomato.gui.keypop.KeyPopHistoryPersistenceTest'
                    includeTestsMatching 'tomato.gui.stats.HistoricalStatisticsTest'
                    includeTestsMatching 'tomato.gui.chat.ChatExplorerTest.renderDesktopCompactFilteredAndEmptyStates'
                    includeTestsMatching 'tomato.gui.chat.ChatConsistencyTest'
                    includeTestsMatching 'tomato.gui.notifications.NotificationsConsistencyTest'
                    includeTestsMatching 'tomato.gui.character.CharacterJournalGuiTest'
                    includeTestsMatching 'tomato.gui.character.CharacterJournalLayoutTest'
                    includeTestsMatching 'tomato.gui.quest.QuestConsistencyTest'
                    includeTestsMatching 'tomato.gui.keypop.KeyPopTest.rendersAllViewsAtNormalAndCompactSizes'
                    includeTestsMatching 'tomato.gui.myinfo.MyInfoGuiTest'
                    // Wave 1 trust, scoped publication and editor surfaces. Pure model suites stay in test.
                    includeTestsMatching 'tomato.SetupWorkspaceTest'
                    includeTestsMatching 'tomato.gui.chat.ShellHookIntegrationTest' // Also covers Wave 2 production registrations and disposal.
                    includeTestsMatching 'tomato.gui.myinfo.MyInfoEvidenceTest'
                    includeTestsMatching 'tomato.gui.logging.LoggingGuiTest'
                    includeTestsMatching 'tomato.gui.logging.CollectionEvidenceTest.sharedCollectionStateChangesWhileBothDisplaysRemainPaused'
                    includeTestsMatching 'tomato.gui.activity.ActivityModulesTest'
                    includeTestsMatching 'tomato.gui.dps.DpsInspectMenuTest'
                    includeTestsMatching 'tomato.gui.character.PetFeedingFormTest'
                    includeTestsMatching 'tomato.gui.quest.QuestGuiTest'
                    includeTestsMatching 'tomato.gui.chat.SharedChatPolicyTest.historicalIgnorePublishesToLiveAndOtherPagesWithoutReplayingAlerts'
                    includeTestsMatching 'tomato.gui.chat.SharedChatPolicyTest.receiptEvidenceSurvivesLocalUnignoreAndStaleDraftCannotClobberNewPolicy'
                    includeTestsMatching 'tomato.gui.chat.SharedChatPolicyTest.failedFilterSaveRetainsInputAndActivePolicyWhileClassificationSnapshotsStayPinned'
                    includeTestsMatching 'tomato.gui.keypop.ExactContributorTest'
                    includeTestsMatching 'tomato.gui.maingui.SocialRuleEditorTest'
                    includeTestsMatching 'tomato.gui.maingui.RuleEditorActionsTest'
                    includeTestsMatching 'tomato.gui.notifications.NotificationDraftTest'
                    includeTestsMatching 'tomato.realmshark.SilentRuleEditorTest'
                    includeTestsMatching 'tomato.gui.maingui.AlertRuleLayoutEvidenceTest'
                    includeTestsMatching 'tomato.gui.character.PetLayoutEvidenceTest'
                    includeTestsMatching 'tomato.gui.myinfo.MyInfoLayoutEvidenceTest'
                    includeTestsMatching 'tomato.gui.stats.LootLayoutEvidenceTest'
                    includeTestsMatching 'ui.SetupLayoutEvidenceTest'
                    // Wave 2 queried views and retained live controls. Large query/model stress stays in test.
                    includeTestsMatching 'tomato.gui.activity.ActivityArchiveNativeTest'
                    includeTestsMatching 'tomato.gui.chat.SocialArchiveNativeTest'
                    includeTestsMatching 'tomato.gui.security.InspectArchiveNativeTest'
                    includeTestsMatching 'tomato.gui.stats.StatisticsArchiveNativeTest'
                    includeTestsMatching 'tomato.gui.history.HistoryLibraryNativeTest'
                    includeTestsMatching 'tomato.gui.dps.EncounterLibraryNativeTest'
                    includeTestsMatching 'tomato.gui.logging.LoggingNativeTest'
                    includeTestsMatching 'tomato.gui.history.ArchiveWorkspaceTest.typedColumnsPresetsNamesCopyAndKeyboardDetailsAreUsableHeadlessly'
                    includeTestsMatching 'tomato.gui.history.ArchiveWorkspaceTest.libraryShowsBadEntryAndRetainsSelectionAcrossRefresh'
                    includeTestsMatching 'tomato.gui.chat.ChatArchiveClientTest.realWorkspaceRestoresNamedStateAndRejectsOldRendererCallbacks'
                    includeTestsMatching 'tomato.gui.chat.ChatArchiveClientTest.displayedPolicyChangesCreateNewPinsWhileAnOldExportLeaseKeepsItsReasons'
                    includeTestsMatching 'tomato.gui.chat.ChatArrivalStateTest'
                    includeTestsMatching 'tomato.gui.keypop.KeyPopArchiveClientTest.queriedTabsUseGlobalPopulationAndCurrentSummaryExportSurvivesRestart'
                    includeTestsMatching 'tomato.gui.keypop.KeyPopLiveStateTest'
                    includeTestsMatching 'tomato.gui.activity.ActivityArchiveUiTest.compactRunColumnsHaveVisibleOutcomeAndKeyboardSortChangesGlobalQuery'
                    includeTestsMatching 'tomato.gui.activity.ActivityArchiveUiTest.resourceDetailsUseOldPinUntilRefreshAndClientExportIncludesTimeline'
                    includeTestsMatching 'tomato.gui.security.InspectArchiveClientTest'
                    includeTestsMatching 'tomato.gui.security.InspectFacetStateTest'
                    includeTestsMatching 'tomato.gui.character.CharacterRosterStateTest'
                    includeTestsMatching 'tomato.gui.dps.EncounterLibraryStateTest'
                    includeTestsMatching 'tomato.gui.dps.DungeonListTest'
                    includeTestsMatching 'tomato.gui.logging.LoggingWorkflowTest'
                    includeTestsMatching 'tomato.gui.stats.LootArchiveStateTest.queriedWorkspacePreservesNamedTabQuerySortSelectionColumnsAndIndependentScopes'
                    includeTestsMatching 'tomato.gui.stats.LootArchiveStateTest.liveMultiFacetsFilterAllAggregatedItemsAndRestoreWithoutAWindow'
                    includeTestsMatching 'tomato.gui.stats.LootArchiveStateTest.liveFameRangeMeasureAndDelayedCharacterChoiceRestore'
                    includeTestsMatching 'tomato.gui.stats.LootArchiveStateTest.liveStateSaveFailureRetainsActiveFacetsAndCanRetryWithoutChangingThem'
                    includeTestsMatching 'tomato.gui.stats.LootArchiveStateTest.arrivingFacetChoicesPreserveTheUnappliedLiveDraft'
                    // Wave 3 connected analysis: routed shell, Back restore and analytics drill-downs.
                    includeTestsMatching 'tomato.gui.route.ShellBackActionTest'
                    includeTestsMatching 'tomato.gui.route.RouteBackRestoreTest'
                    includeTestsMatching 'tomato.ShellRouteRegistrationTest'
                    includeTestsMatching 'tomato.gui.logging.CoverageExplanationTest.errorRouteFocusesAllowlistedPacketIssuesAndBackRestoresLogging'
                    includeTestsMatching 'tomato.gui.stats.LootDrillDownTest.workspaceDrillsVariantToOccurrenceToVerifiedRunAndExplainsUnavailableNavigation'
                    includeTestsMatching 'tomato.gui.stats.CohortComparisonTest.statisticsWorkspaceEditsCohortsThroughQueryIntent'
                    includeTestsMatching 'tomato.gui.stats.FameGraphPinTest.savedViewerHasRangeGainControlsKeepsPinsAndSaysMapNotRecorded'
                    includeTestsMatching 'tomato.gui.stats.FameGraphPinTest.liveTrackerShowsTheSameTextDelta'
                    // Wave 3 alerts and Bridge: contextual drafts, Key-pop handoff, decisions, Bridge settings/review.
                    includeTestsMatching 'tomato.gui.maingui.AlertDraftContractTest'
                    includeTestsMatching 'tomato.gui.chat.ChatAlertDraftTest'
                    includeTestsMatching 'tomato.gui.keypop.KeyPopNotificationHandoffTest'
                    includeTestsMatching 'tomato.gui.notifications.RecentDecisionsTest'
                    includeTestsMatching 'tomato.bridge.BridgeDraftActiveTest'
                    includeTestsMatching 'tomato.bridge.BridgeSavedReviewTest'
                    includeTestsMatching 'tomato.gui.bridge.BridgeUiTest'
                }
                testLogging { events 'failed'; exceptionFormat 'full' }
            }
        }
    }
}
